<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>IA 2026 - Mestre do Jogo</title>
    <style>
        /* Mantenha seu estilo Cyberpunk anterior e adicione: */
        .ranking-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; border: 2px solid #00f3ff; padding: 20px; z-index: 100; border-radius: 10px; width: 300px; }
        .nickname-area { padding: 10px; border-bottom: 1px solid #333; margin-bottom: 10px; }
        .gold { color: gold; font-weight: bold; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="chat-container">
    <div class="nickname-area">
        <input type="text" id="nickname" placeholder="Seu Nickname Gamer...">
        <button onclick="document.querySelector('.ranking-panel').style.display='block'; carregarRanking()">🏆 Ranking</button>
    </div>
    
    <div id="historico"></div>

    <div class="input-area">
        <input type="text" id="pergunta" placeholder="Mande sua resposta ou peça uma charada...">
        <button onclick="enviarMensagem()">ENVIAR</button>
    </div>
</div>

<!-- Painel de Ranking -->
<div class="ranking-panel">
    <h3 style="color:#00f3ff">🏆 TOP 10 JOGADORES</h3>
    <div id="lista-ranking"></div>
    <button onclick="document.querySelector('.ranking-panel').style.display='none'" style="margin-top:10px">Fechar</button>
</div>

<script>
    const URL_BACKEND = "https://SEU-APP.onrender.com"; // AJUSTE AQUI

    async function enviarMensagem() {
        const input = document.getElementById("pergunta");
        const nickInput = document.getElementById("nickname");
        const texto = input.value;
        const nick = nickInput.value;

        if (!texto || !nick) return alert("Nickname e Pergunta são obrigatórios!");

        input.value = "";
        const historico = document.getElementById("historico");
        historico.innerHTML += `<div class="mensagem user"><b>${nick}:</b> ${texto}</div>`;

        try {
            const res = await fetch(`${URL_BACKEND}/api/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ pergunta: texto, nickname: nick })
            });

            const dados = await res.json();
            
            // Efeito Confete
            if (dados.resposta.includes("Acertou") || dados.resposta.includes("Parabéns")) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            historico.innerHTML += `<div class="mensagem bot"><b>Mestre:</b> ${dados.resposta}</div>`;
            historico.scrollTop = historico.scrollHeight;
        } catch (e) { alert("Erro de conexão!"); }
    }

    async function carregarRanking() {
        const lista = document.getElementById("lista-ranking");
        lista.innerHTML = "Carregando...";
        const res = await fetch(`${URL_BACKEND}/api/ranking`);
        const dados = await res.json();
        
        lista.innerHTML = dados.map((j, i) => `
            <div style="margin-bottom:5px">
                ${i === 0 ? '🥇' : i+1+'º'} ${j.nome} - <b>${j.xp} XP</b>
            </div>
        `).join('');
    }
</script>
</body>
</html>
